# Publishes the k2bnetworksolutions/ folder to GitHub Pages
# whenever it changes on main.
name: Deploy K2B site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "k2bnetworksolutions/**"
      - ".github/workflows/k2b-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: k2bnetworksolutions
      - id: deployment
        uses: actions/deploy-pages@v4

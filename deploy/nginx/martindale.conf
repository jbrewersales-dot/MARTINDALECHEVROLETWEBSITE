# Nginx config for the Martindale Chevrolet website.
# Installed to /etc/nginx/sites-available/martindale by deploy/lightsail-launch-script.sh
# Certbot (deploy/enable-https.sh) adds the HTTPS parts automatically.

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # enable-https.sh replaces this with your real domain name.
    server_name _;

    root /var/www/martindale;
    index index.html;

    # Clean URLs: /inventory works as well as /inventory.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Browser can cache styles, scripts and images for a week.
    location ~* \.(css|js|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # The vehicle list must always be fresh, so never cache it.
    location = /inventory/vehicles.json {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Don't serve hidden files like .git or .env if they ever end up here.
    location ~ /\. {
        deny all;
    }
}
